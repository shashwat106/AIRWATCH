services:
  - type: web
    name: airwatch-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: DATA_GOV_IN_KEY
        sync: false
